    <!-- Splash Screen with "O" and blinking eye -->
    <div id="intro-splash" class="intro-splash" aria-label="VisionRAG Loading Animation">

                </div>
              </div>
              <div class="eyelid eyelid-lower"></div>
            </div>
          </div>
        </div>
        <div class="splash-text">
          <span class="brand-name">Vision<span class="accent-text">RAG</span></span>

        </div>
        <button id="skip-splash-btn" class="skip-splash-btn" title="Skip animation">Skip intro</button>
      </div>
    </div>

    <!-- Main ChatGPT-style Application Shell -->
    <div id="app" class="app-container app-hidden">
      <!-- Left Sidebar -->
      <aside id="sidebar" class="sidebar">
        <!-- Sidebar content rendered by Sidebar.js -->
      </aside>

      <!-- Main Chat Area -->
      <main id="main-content" class="main-content">
        <!-- Main chat content rendered by ChatArea.js -->
      </main>

      <!-- Overlays and Modals -->
