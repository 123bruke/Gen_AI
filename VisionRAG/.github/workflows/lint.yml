name: Lint & Code Quality

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8 isort mypy

      - name: Check code formatting with Black
        run: |
          black --check --diff backend ml tests || true

      - name: Lint with Ruff
        run: |
          ruff check backend ml tests || true

      - name: Lint with Flake8
        run: |
          flake8 backend ml tests --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Type check with Mypy
        run: |
          mypy backend --ignore-missing-imports || true

  frontend-lint:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Verification
        run: |
          npm run build --if-present
